version: 2
updates:
  # uv.lock is the source of truth, so every bump must change pyproject.toml
  # and uv.lock together. Each group becomes at most one pull request.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime-dependencies:
        patterns:
          - "numpy"
          - "pyarrow"
          - "pyyaml"
      # dora-rs is deliberately absent: the node SDK version is part of the
      # Node contract and needs an explicit compatibility check on its own.
      forge-stack:
        patterns:
          - "forge-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
