[project]
name = "relative-pose-policy-node"
version = "0.1.0"
description = "Standalone Forge Query policy node for resolving relative Cartesian poses."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "dora-rs==0.4.1",
    "forge-kinematics",
    "forge-msgs",
    "forge-tool[dora]>=0.1.0,<0.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
forge-relative-motion-policy = "relative_pose_policy_node.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]
build = [
    "pyinstaller>=6.18.0",
]

[tool.uv.sources]
forge-kinematics = { path = "../../forge/packages/kinematics" }
forge-msgs = { path = "../../forge/packages/msgs", editable = true }
forge-tool = { path = "../../forge/packages/tool" }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
